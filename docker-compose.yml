name: rataria

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rataria
      POSTGRES_PASSWORD: rataria
      POSTGRES_DB: rataria
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rataria -d rataria"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: sh -c "pnpm --filter @rataria/database db:migrate && pnpm --filter @rataria/database db:seed"
    environment:
      DATABASE_URL: postgresql://rataria:rataria@postgres:5432/rataria
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: node apps/api/dist/main.js
    environment:
      DATABASE_URL: postgresql://rataria:rataria@postgres:5432/rataria
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
    command: node apps/worker/dist/main.js
    environment:
      DATABASE_URL: postgresql://rataria:rataria@postgres:5432/rataria
      REDIS_URL: redis://redis:6379
      INGESTION_INTERVAL_MS: 15000
      OPPORTUNITY_TTL_MS: 120000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    environment:
      API_URL: http://api:3001
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

volumes:
  postgres-data:

networks:
  internal:
