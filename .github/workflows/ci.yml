name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rataria
          POSTGRES_PASSWORD: rataria
          POSTGRES_DB: rataria
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rataria" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://rataria:rataria@localhost:5432/rataria
      REDIS_URL: redis://localhost:6379
      # Segredo de teste (CI). Em produção vem de secret do ambiente.
      JWT_SECRET: ci-test-secret-abcdefghijklmnop-0123456789

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalação determinística
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Migrações em banco vazio
        run: pnpm db:migrate

      - name: Seed determinístico
        run: pnpm db:seed

      - name: Build (packages e apps)
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes (unitários e integração)
        run: pnpm test

      - name: Verificação simples de segredos versionados
        run: |
          if git grep -nE "(password|secret|api[_-]?key)\s*[:=]\s*['\"][A-Za-z0-9+/]{16,}" -- ':!*.lock' ':!pnpm-lock.yaml' ':!.github/workflows/ci.yml'; then
            echo "Possível segredo encontrado" && exit 1
          fi
