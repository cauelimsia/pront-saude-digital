# Overlay para usar o Supabase como banco (em vez do Postgres local em Docker).
# Combine DEPOIS do overlay de produção:
#   docker compose -f docker-compose.yml \
#     -f infra/deploy/docker-compose.prod.yml \
#     -f infra/deploy/docker-compose.supabase.yml up -d --build
#
# No .env, defina DATABASE_URL com a string do Supabase (use o "Session Pooler",
# porta 5432, IPv4 — compatível com Prisma e com hosts sem IPv6). Ver docs/DEPLOY.md.

services:
  # Não sobe o Postgres local: fica atrás de um profile inativo.
  postgres:
    profiles: ["local-db-disabled"]

  migrate:
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL com a string do Supabase}

  api:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}

  worker:
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
